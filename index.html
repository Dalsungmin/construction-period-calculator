<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공사기간 산정</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* 입력 화면 보조 스타일 */
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .act{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fafbfc}
    .act-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
    .card .act-del{width:auto;margin:0;padding:4px 10px;background:#fee2e2;color:#b91c1c;font-size:12px}
    .card .btn-sub{background:#eef2ff;color:var(--primary);margin-top:10px;padding:10px;font-size:14px}
    .chk{display:flex;gap:16px;margin-top:14px;font-size:13px}
    .chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text)}
    .card .chk input{width:auto}
    .conds{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
    .err{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:13px}
    .placeholder{color:var(--sub);font-size:14px;text-align:center;padding:60px 0}
  </style>
</head>
<body>
  <header class="header"><h1>공사기간 산정</h1></header>

  <main class="layout">
    <!-- ── 입력 ── -->
    <section class="card">
      <h2>입력 조건</h2>

      <label for="station">관측지점</label>
      <select id="station"><option>불러오는 중...</option></select>

      <label for="startDate">착공일</label>
      <input type="date" id="startDate">

      <div class="row2">
        <div>
          <label for="prepDays">준비기간(일)</label>
          <input type="number" id="prepDays" min="0" value="30">
        </div>
        <div>
          <label for="cleanDays">정리기간(일)</label>
          <input type="number" id="cleanDays" min="0" value="30">
        </div>
      </div>

      <h3>공종 (순차 진행)</h3>
      <div id="acts"></div>
      <button type="button" class="btn-sub" id="addAct">+ 공종 추가</button>

      <div class="chk">
        <label><input type="checkbox" id="dust"> 미세먼지 반영</label>
        <label><input type="checkbox" id="round" checked> 월 비작업일 반올림</label>
      </div>

      <button type="button" id="calcBtn">계산하기</button>
      <div class="err" id="err"></div>
    </section>

    <!-- ── 결과 ── -->
    <div>
      <section class="card" id="emptyMsg">
        <div class="placeholder">왼쪽에 조건을 입력하고 <b>계산하기</b>를 누르세요.</div>
      </section>

      <section class="card" id="result" hidden>
        <h2>산정 결과</h2>
        <div class="kpis">
          <div class="kpi main"><span>총 공사기간</span><b id="kTotal">-</b></div>
          <div class="kpi"><span>준공 예정일</span><b id="kEnd">-</b></div>
          <div class="kpi"><span>순작업일</span><b id="kWork">-</b></div>
          <div class="kpi"><span>비작업일</span><b id="kNon">-</b></div>
        </div>

        <h3>공정 구성</h3>
        <div class="timeline" id="timeline"></div>

        <h3>공종별 일정</h3>
        <table class="tbl" id="actTable"></table>

        <h3>월별 작업일 / 비작업일</h3>
        <div class="chart-box"><canvas id="monthChart"></canvas></div>

        <h3>월별 상세</h3>
        <table class="tbl" id="detail"></table>
      </section>
    </div>
  </main>

  <script type="module">
    import { calcProject, PRESETS, CONDITIONS } from './calc.js';
    import { renderResult } from './result.js';

    const $ = id => document.getElementById(id);
    const db = {};

    // ── 데이터 불러오기 ──
    async function loadData() {
      const [weather, holidays] = await Promise.all([
        fetch('weather.json').then(r => r.json()),
        fetch('holidays.json').then(r => r.json())
      ]);
      db.weather = weather;
      db.holidays = holidays;

      $('station').innerHTML = Object.entries(weather.stations)
        .map(([id, st]) => `<option value="${id}">${st.name} (${id})</option>`).join('');
      if (weather.stations['108']) $('station').value = '108';   // 기본: 서울
    }

    // ── 공종 행 ──
    const presetOptions = Object.entries(PRESETS)
      .map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('');

    function condText(key) {
      const c = PRESETS[key].conds;
      return c.length ? '적용: ' + c.map(x => CONDITIONS[x]).join(' · ') : '기상조건 미적용';
    }

    function addAct(preset = 'earth', workDays = 60, name = '') {
      const div = document.createElement('div');
      div.className = 'act';
      div.innerHTML = `
        <div class="act-head"><span class="act-no"></span>
          <button type="button" class="act-del">삭제</button></div>
        <label>공종명 (선택)</label>
        <input type="text" class="a-name" placeholder="비우면 프리셋 이름 사용" value="${name}">
        <div class="row2">
          <div><label>기상조건 프리셋</label><select class="a-preset">${presetOptions}</select></div>
          <div><label>순작업일수</label><input type="number" class="a-days" min="1" value="${workDays}"></div>
        </div>
        <div class="conds"></div>`;
      const sel = div.querySelector('.a-preset');
      sel.value = preset;
      div.querySelector('.conds').textContent = condText(preset);
      sel.onchange = () => div.querySelector('.conds').textContent = condText(sel.value);
      div.querySelector('.act-del').onclick = () => { div.remove(); renumber(); };
      $('acts').appendChild(div);
      renumber();
    }

    function renumber() {
      document.querySelectorAll('.act').forEach((el, i) =>
        el.querySelector('.act-no').textContent = `공종 ${i + 1}`);
    }

    // ── 계산 ──
    function showError(msg) {
      $('err').textContent = msg;
      $('err').style.display = msg ? 'block' : 'none';
    }

    function calculate() {
      showError('');
      try {
        if (!db.weather) throw new Error('데이터를 아직 불러오지 못했습니다.');
        if (!$('startDate').value) throw new Error('착공일을 입력하세요.');

        const acts = [...document.querySelectorAll('.act')].map(el => ({
          name: el.querySelector('.a-name').value.trim(),
          preset: el.querySelector('.a-preset').value,
          workDays: Number(el.querySelector('.a-days').value)
        }));
        if (!acts.length) throw new Error('공종을 1개 이상 추가하세요.');
        if (acts.some(a => !(a.workDays > 0))) throw new Error('순작업일수는 1 이상이어야 합니다.');

        const res = calcProject({
          startDate: $('startDate').value,
          station: $('station').value,
          prepDays: Number($('prepDays').value) || 0,
          cleanDays: Number($('cleanDays').value) || 0,
          acts, db,
          dust: $('dust').checked,
          round: $('round').checked
        });

        $('emptyMsg').hidden = true;
        renderResult(res);
        if (window.innerWidth <= 860) $('result').scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        showError(e.message);
        console.error(e);
      }
    }

    // ── 초기화 ──
    $('addAct').onclick = () => addAct();
    $('calcBtn').onclick = calculate;

    const today = new Date();
    $('startDate').value = `${today.getFullYear() + 1}-03-01`;   // 기본 착공일: 내년 3월 1일
    addAct('earth', 60, '토공');
    addAct('rcBldg', 120, '골조');

    loadData().catch(e => showError('데이터 불러오기 실패: ' + e.message));
  </script>
</body>
</html>
