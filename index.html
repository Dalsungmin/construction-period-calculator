<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공사기간 산정</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .layout{grid-template-columns:1fr}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
    .chk{display:flex;gap:18px;margin-top:14px;font-size:13px}
    .chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text)}
    .card .chk input{width:auto}
    .tbl-wrap{overflow-x:auto}
    .in-tbl td{padding:4px}
    .in-tbl input,.in-tbl select{padding:7px;font-size:13px}
    .in-tbl .name{min-width:110px}
    .in-tbl select{min-width:150px}
    .card .del{width:auto;margin:0;padding:6px 10px;background:#fee2e2;color:#b91c1c;font-size:12px}
    .btns{display:flex;gap:10px;margin-top:16px}
    .card .btns button{margin:0}
    .card .sub{background:#eef2ff;color:var(--primary)}
    .hint{font-size:12px;color:var(--sub);margin-top:8px}
    .err{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:13px}
    .result-head{display:flex;justify-content:space-between;align-items:center}
    .result-head h2{margin:0}
    .card .result-head button{width:auto;margin:0;padding:8px 14px;font-size:13px}
    details{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
    summary{cursor:pointer;font-size:14px;font-weight:600}
    details .tbl{margin-top:8px}
    #verifyOut{margin-top:12px;font-size:14px;line-height:1.7}
    .ok{color:#059669;font-weight:700}.ng{color:#dc2626;font-weight:700}
    #simSummary{font-size:14px;line-height:1.7;margin-bottom:10px}
    .pos{color:#dc2626;font-weight:700}.neg{color:#2563eb}
    .card input[type=file]{padding:8px}

  </style>
</head>
<body>
  <header class="header"><h1>공사기간 산정</h1></header>

  <main class="layout">
    <!-- 기본 조건 -->
    <section class="card">
      <h2>기본 조건</h2>
      <div class="grid">
        <div><label for="station">관측지점</label><select id="station"></select></div>
        <div><label for="start">착공일</label><input type="date" id="start"></div>
        <div><label for="prepType">준비기간 유형</label><select id="prepType"></select></div>
        <div><label for="prepDays">준비기간(일)</label><input type="number" id="prepDays" min="0"></div>
        <div><label for="cleanDays">정리기간(일, 최대 30)</label><input type="number" id="cleanDays" min="0" max="30" value="30"></div>
      </div>
      <div class="chk">
        <label><input type="checkbox" id="dust"> 미세먼지 반영</label>
        <label><input type="checkbox" id="round" checked> 월 비작업일 반올림</label>
      </div>
    </section>

    <!-- 공종 -->
    <section class="card">
      <h2>CP 공종 (순차 진행)</h2>
      <div class="tbl-wrap">
        <table class="tbl in-tbl" id="acts">
          <thead><tr>
            <th>공종명</th><th>수량</th><th>1일 작업량</th><th>조수</th>
            <th>추가일수</th><th>작업일수(직접)</th><th>기상조건</th><th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="hint">작업일수(직접)를 비우면 수량 ÷ (1일 작업량 × 조수) + 추가일수로 계산합니다.</p>
      <div class="btns">
        <button type="button" class="sub" id="addRow">+ 공종 추가</button>
        <button type="button" id="calc">계산하기</button>
      </div>
      <div class="err" id="err"></div>
    </section>

    <!-- 결과 -->
    <section class="card" id="result" hidden>
      <div class="result-head">
        <h2>산정 결과</h2>
        <button type="button" class="sub" id="csv">CSV 다운로드</button>
      </div>
      <div class="kpis" style="margin-top:16px">
        <div class="kpi main"><span>총 공사기간</span><b id="kTotal">-</b></div>
        <div class="kpi"><span>준공 예정일</span><b id="kEnd">-</b></div>
        <div class="kpi"><span>순작업일</span><b id="kWork">-</b></div>
        <div class="kpi"><span>비작업일</span><b id="kNon">-</b></div>
      </div>

      <h3>공정 구성</h3>
      <div class="timeline" id="timeline"></div>

      <h3>공종별 일정</h3>
      <div class="tbl-wrap"><table class="tbl" id="actTable"></table></div>

      <h3>월별 작업일 / 비작업일</h3>
      <div class="chart-box"><canvas id="monthChart"></canvas></div>

      <h3>월별 상세</h3>
      <div class="tbl-wrap"><table class="tbl" id="detail"></table></div>

      <h3>산정 근거 (공종별 A·B·C)</h3>
      <div id="calcDetail"></div>
    </section>

    <!-- 회귀식 검증 -->
    <section class="card" id="verifyCard" hidden>
      <h2>회귀식 검증</h2>
      <div class="grid">
        <div><label for="model">시설 유형</label><select id="model"></select></div>
        <div><label for="vC">공사비 C (억원)</label><input type="number" id="vC"></div>
        <div><label for="vG">지상층수 G</label><input type="number" id="vG"></div>
        <div><label for="vB">지하층수 B</label><input type="number" id="vB"></div>
        <div><label for="vA">연면적 A (㎡)</label><input type="number" id="vA"></div>
      </div>
      <div class="btns"><button type="button" id="verify">검증하기</button></div>
      <div id="verifyOut"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
